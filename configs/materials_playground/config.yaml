# Materials Playground Configuration

llm:
  litellm:
    provider: "openai"
    model: "ez/claude-opus-4-6"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    temperature: 0.2
    max_tokens: 16384
    timeout: 120
    max_retries: 3
    retry_delay: 1.0

  openai:
    provider: "openai"
    model: "Vendor2/Kimi-k2.5"
    api_key: "${GPUGEEK_API_KEY}"
    base_url: "https://api.gpugeek.com/v1"
    temperature: 0.2
    max_tokens: 16384
    timeout: 120
    max_retries: 10
    retry_delay: 10.0

  fallback_openai:
    provider: "openai"
    model: "${DEFAULT_MODEL}"
    api_key: "${OPENAI_API_KEY}"
    base_url: "${GPT_BASE_URL}"
    temperature: 0.2
    max_tokens: 16384
    timeout: 120
    max_retries: 3
    retry_delay: 1.0

  claude_opus:
    provider: "openai"
    model: "Vendor2/Claude-4.6-opus"
    api_key: "${GPUGEEK_API_KEY}"
    base_url: "https://api.gpugeek.com/v1"
    temperature: 0.2
    max_tokens: 16384
    timeout: 120
    max_retries: 10
    retry_delay: 10.0

  gpugeek_gpt54:
    provider: "openai"
    model: "Vendor2/GPT-5.4"
    api_key: "${GPUGEEK_API_KEY}"
    base_url: "https://api.gpugeek.com/v1"
    temperature: 0.2
    max_tokens: 16384
    timeout: 120
    max_retries: 10
    retry_delay: 10.0

  litellm_cds_claude46_opus:
    provider: "openai"
    model: "cds/Claude-4.6-opus"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    temperature: 0.2
    max_tokens: 16384
    timeout: 120
    max_retries: 10
    retry_delay: 10.0

  litellm_ez_claude_opus:
    provider: "openai"
    model: "ez/claude-opus-4-6"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    temperature: 0.2
    max_tokens: 16384
    timeout: 120
    max_retries: 10
    retry_delay: 10.0

  litellm_cds_gpt54:
    provider: "openai"
    model: "cds/GPT-5.4"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    temperature: 0.2
    max_tokens: 16384
    timeout: 120
    max_retries: 10
    retry_delay: 10.0

  kimi:
    provider: "openai"
    model: "scimaster/kimi-k2.5"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    temperature: 0.2
    max_tokens: 16384
    timeout: 120
    max_retries: 3
    retry_delay: 1.0

  deepseek_litellm:
    provider: "openai"
    model: "deepseek-v3.2"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    temperature: 0.2
    max_tokens: 16384
    timeout: 120
    max_retries: 3
    retry_delay: 1.0


  default: "openai"

agents:
  general:
    llm: "openai"
    max_turns: 500
    tools:
      builtin: ["*"]
      mcp: "../../playground/materials_playground/config/mcp_config.${SERVICE_ENV}.json"
      bohrium_upload: "bohrium_upload"
      bohrium_job: "bohrium_job"
    skills:
      - "abacus"
      - "abinit"
      - "cp2k"
      - "gromacs"
      - "lammps"
      - "mlips"
      - "orca"
      - "pyatb"
      - "pyscf"
      - "quantum_espresso"
      - "proposal-review"
      - "manuscript-scribe"
    context:
      max_tokens: 128000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 6
    system_prompt_file: "prompts/system_prompt.txt"
    user_prompt_file: "prompts/user_prompt.txt"

skills:
  enabled: true
  skills_root: /home/heartsooo/evomaster/EvoMaster/evomaster/skills/materials

mcp:
  tool_include_only:
    mat_struct_db:
      - fetch_structures_from_db

session:
  type: "local"
  local:
    working_dir: "./playground/materials_playground/workspace"
    timeout: 120
    gpu_devices: null
    cpu_devices: null
    symlinks: {}

  docker:
    image: "evomaster/base:latest"
    container_name: null
    use_existing_container: null
    working_dir: "/workspace"
    memory_limit: "32g"
    cpu_limit: 8.0
    gpu_devices: null
    network_mode: "host"
    volumes: {"./playground/materials_playground/workspace":"/workspace"}
    env_vars: {}
    auto_remove: false
    timeout: 300

llm_output:
  show_in_console: true
  log_to_file: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null
  console: true
